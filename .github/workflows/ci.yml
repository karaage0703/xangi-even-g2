name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  app:
    name: App tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run app tests
        run: npm test

      - name: Build app
        run: npm run build

  bridge:
    name: Bridge tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run bridge tests
        run: python -m unittest bridge/test_even_g2_bridge.py bridge/test_extension_runtime.py bridge/test_prepare_update.py

      - name: Check bridge syntax
        run: python -m py_compile bridge/even_g2_bridge.py bridge/extension_runtime.py bridge/stt_server.py

      - name: Check extension entrypoint syntax
        run: sh -n scripts/xangi-extension scripts/prepare-update
